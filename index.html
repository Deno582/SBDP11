<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Door Monitoring Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-20px); }
    }
    .custom-notification {
      animation: fadeIn 0.4s ease-out;
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.95), rgba(109, 40, 217, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 16px;
      min-width: 320px;
      color: white;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    .custom-notification.fade-out {
      animation: fadeOut 0.5s ease-in forwards;
    }
    .notification-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
    }
    .notification-body {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  
  <div id="loadingScreen" class="min-h-screen flex items-center justify-center">
    <p class="text-white text-lg">Loading...</p>
  </div>

  <div id="loginPage" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">IoT Door Monitor</h1>
        <p class="text-purple-200">Login dengan Firebase</p>
      </div>

      <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-8 border border-white/20">
        <form id="loginForm" class="space-y-6">
          <input type="email" id="email" placeholder="Email" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white" required>
          <input type="password" id="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white" required>
          <div id="loginError" class="hidden text-red-400 text-sm"><span id="loginErrorText"></span></div>
          <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-xl hover:bg-purple-700">Login</button>
        </form>
        <button onclick="togglePage()" class="w-full mt-4 text-purple-400 text-sm hover:text-purple-300">Belum punya akun? Daftar</button>
      </div>
    </div>
  </div>

  <div id="registerPage" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">Daftar Akun</h1>
      </div>

      <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-8 border border-white/20">
        <form id="registerForm" class="space-y-6">
          <input type="email" id="registerEmail" placeholder="Email" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white" required>
          <input type="password" id="registerPassword" placeholder="Password (min 6 char)" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white" required minlength="6">
          <div id="registerError" class="hidden text-red-400 text-sm"><span id="registerErrorText"></span></div>
          <div id="registerSuccess" class="hidden text-green-400 text-sm">Akun berhasil dibuat!</div>
          <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-xl hover:bg-purple-700">Daftar</button>
        </form>
        <button onclick="togglePage()" class="w-full mt-4 text-purple-400 text-sm hover:text-purple-300">Sudah punya akun? Login</button>
      </div>
    </div>
  </div>

  <div id="dashboardPage" class="hidden">
    <!-- Notifikasi Audio Ring Bell dengan Web Audio API -->
    <audio id="notificationSound" preload="auto">
      <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBg==" type="audio/wav">
    </audio>

    <div class="p-8">
      <div class="max-w-7xl mx-auto mb-8 flex justify-between items-center">
        <div>
          <h1 class="text-5xl font-bold text-white">IoT Door Monitor</h1>
          <p class="text-purple-200">User: <span id="userEmail"></span></p>
        </div>
        <button onclick="logout()" class="bg-red-600 text-white px-6 py-3 rounded-xl">Logout</button>
      </div>

      <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-6">
        <div class="bg-white/10 rounded-3xl p-8 border border-white/20">
          <h2 class="text-2xl font-bold text-white mb-6">Status Pintu</h2>
          <div class="text-center py-8">
            <p id="statusText" class="text-5xl font-bold text-green-400 mb-2">CLOSED</p>
            <p id="lastUpdate" class="text-purple-200">Terakhir update: -</p>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-white/5 rounded-xl p-4"><p class="text-purple-300 text-sm">Total Logs</p><p id="totalLogs" class="text-white text-2xl">0</p></div>
            <div class="bg-white/5 rounded-xl p-4"><p class="text-purple-300 text-sm">Notifikasi</p><p id="notifStatus" class="text-white text-2xl">OFF</p></div>
          </div>
        </div>

        <div class="bg-white/10 rounded-3xl p-8 border border-white/20">
          <h2 class="text-2xl font-bold text-white mb-6">Riwayat Aktivitas</h2>
          <div id="historyContainer" class="space-y-3 min-h-[400px]">
            <p class="text-purple-300 text-center py-12">Belum ada riwayat</p>
          </div>
          <div id="pagination" class="hidden mt-6 flex justify-center gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="customNotificationContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA1kCaXAKhzdv28TwxCyi_Sre5SzQmYyKQ",
      authDomain: "sbdp10-6b194.firebaseapp.com",
      databaseURL: "https://sbdp10-6b194-default-rtdb.firebaseio.com",
      projectId: "sbdp10-6b194",
      storageBucket: "sbdp10-6b194.firebasestorage.app",
      messagingSenderId: "855068226828",
      appId: "1:855068226828:web:072650849ed568ea144529"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let doorLogs = [];
    let currentPage = 1;
    const itemsPerPage = 5;
    let notificationEnabled = false;
    let audioContext = null; // Global AudioContext untuk reuse

    // Request Notification Permission
    function requestNotificationPermission() {
      if ('Notification' in window) {
        console.log('Notification permission status:', Notification.permission);
        
        if (Notification.permission === 'granted') {
          notificationEnabled = true;
          console.log('Notifikasi sudah diizinkan');
          updateNotifStatus();
        } else if (Notification.permission !== 'denied') {
          console.log('Meminta izin notifikasi...');
          Notification.requestPermission().then((permission) => {
            console.log('Permission result:', permission);
            if (permission === 'granted') {
              notificationEnabled = true;
              console.log('Notifikasi disetujui user');
              updateNotifStatus();
            } else {
              notificationEnabled = false;
              console.log('Notifikasi ditolak user');
              updateNotifStatus();
            }
          }).catch(err => {
            console.error('Permission error:', err);
            notificationEnabled = false;
            updateNotifStatus();
          });
        } else {
          console.log('Notifikasi sebelumnya ditolak');
          notificationEnabled = false;
          updateNotifStatus();
        }
      } else {
        console.log('Browser tidak support Notification API');
      }
    }

    function updateNotifStatus() {
      const notifStatusEl = document.getElementById('notifStatus');
      notifStatusEl.textContent = notificationEnabled ? 'ON' : 'OFF';
      notifStatusEl.className = notificationEnabled ? 'text-white text-2xl font-bold text-green-400' : 'text-white text-2xl';
    }

    auth.onAuthStateChanged((user) => {
      document.getElementById('loadingScreen').classList.add('hidden');
      if (user) {
        document.getElementById('userEmail').textContent = user.email;
        showDashboard();
      } else {
        document.getElementById('loginPage').classList.remove('hidden');
      }
    });

    function togglePage() {
      document.getElementById('loginPage').classList.toggle('hidden');
      document.getElementById('registerPage').classList.toggle('hidden');
    }

    function showDashboard() {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('registerPage').classList.add('hidden');
      document.getElementById('dashboardPage').classList.remove('hidden');
      
      // Initialize AudioContext dengan user interaction
      if (!audioContext) {
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          console.log('✅ AudioContext initialized on dashboard load');
        } catch (e) {
          console.log('AudioContext initialization deferred:', e);
        }
      }
      
      requestNotificationPermission();
      updateNotifStatus();
      loadDashboard();
    }

    async function logout() {
      await auth.signOut();
      document.getElementById('dashboardPage').classList.add('hidden');
      document.getElementById('loginPage').classList.remove('hidden');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      const errorText = document.getElementById('loginErrorText');

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        errorText.textContent = error.message;
        errorDiv.classList.remove('hidden');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const errorDiv = document.getElementById('registerError');
      const errorText = document.getElementById('registerErrorText');
      const successDiv = document.getElementById('registerSuccess');

      try {
        await auth.createUserWithEmailAndPassword(email, password);
        successDiv.classList.remove('hidden');
        document.getElementById('registerForm').reset();
        setTimeout(() => {
          togglePage();
          successDiv.classList.add('hidden');
        }, 2000);
      } catch (error) {
        errorText.textContent = error.message;
        errorDiv.classList.remove('hidden');
      }
    });

    function formatDate(timestamp) {
    return new Date(timestamp).toLocaleString('id-ID', {
        timeZone: 'Asia/Jakarta',
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
    }

    function updateStatusUI(state, updatedAt) {
      const statusText = document.getElementById('statusText');
      statusText.textContent = state;
      document.getElementById('lastUpdate').textContent = 'Terakhir update: ' + formatDate(updatedAt);

      if (state === 'OPEN') {
        statusText.className = 'text-5xl font-bold text-red-400 mb-2';
        console.log('Status changed to OPEN, calling playNotification');
        playNotification();
      } else {
        statusText.className = 'text-5xl font-bold text-green-400 mb-2';
      }
    }

    function playNotification() {
      // Bell sound hanya dimainkan dari sendActivityNotification
      // Function ini hanya untuk status UI update
      console.log('=== STATUS UPDATE TO OPEN ===');
    }

    function playRingBellSound() {
      console.log('🔔 === BELL SOUND TRIGGERED ===');
      
      let ctx = audioContext;
      if (!ctx) {
        try {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (err) {
          console.error('AudioContext creation failed:', err);
          return;
        }
      }
      
      console.log('AudioContext state:', ctx.state);
      
      if (ctx.state === 'suspended') {
        console.log('AudioContext suspended, resuming...');
        ctx.resume().then(() => {
          createBellSound(ctx);
        }).catch(e => {
          console.error('Resume failed:', e);
        });
        return;
      }
      
      createBellSound(ctx);
    }
    
    function createBellSound(audioContext) {
      try {
        // Play audio file backup juga
        const audioEl = document.getElementById('notificationSound');
        if (audioEl) {
          audioEl.currentTime = 0;
          audioEl.play().catch(e => console.log('Audio file play warning:', e));
        }
        
        const startTime = audioContext.currentTime + 0.1;
        console.log(`Creating bell sound: 2 nada berselang (800Hz + 1000Hz) x4`);
        
        // Frekuensi bell - 2 nada berselang
        const freq1 = 800;  // Hz nada rendah
        const freq2 = 1000; // Hz nada tinggi
        
        // Mainkan 4 kali dengan durasi 0.4 detik setiap bunyi
        for (let i = 0; i < 4; i++) {
          const toneStart = startTime + (i * 0.4);
          const freq = i % 2 === 0 ? freq1 : freq2; // Berselang
          
          try {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.frequency.value = freq;
            osc.type = 'sine';
            
            // Envelope dengan attack-decay yang smooth
            gain.gain.setValueAtTime(0, toneStart);
            gain.gain.linearRampToValueAtTime(0.85, toneStart + 0.05); // Attack 50ms
            gain.gain.setValueAtTime(0.85, toneStart + 0.3);          // Sustain
            gain.gain.exponentialRampToValueAtTime(0.01, toneStart + 0.4); // Release
            
            osc.start(toneStart);
            osc.stop(toneStart + 0.4);
            
            console.log(`Bell tone ${i}: ${freq}Hz (${i % 2 === 0 ? 'rendah' : 'tinggi'}) durasi 0.4s`);
          } catch (innerErr) {
            console.error(`Error creating tone ${i}:`, innerErr);
          }
        }
        
        console.log('✅ Ring bell sound sequence scheduled (4x bunyi)');
        
      } catch (err) {
        console.error('Error in createBellSound:', err);
      }
    }

    function showCustomNotification(title, body) {
      const container = document.getElementById('customNotificationContainer');
      
      // Buat notification element
      const notifEl = document.createElement('div');
      notifEl.className = 'custom-notification';
      notifEl.innerHTML = `
        <div class="notification-title">${title}</div>
        <div class="notification-body">${body}</div>
      `;
      
      // Tambahkan ke container
      container.appendChild(notifEl);
      
      console.log('Custom notification shown:', title);
      
      // Set timeout untuk fade out
      setTimeout(() => {
        notifEl.classList.add('fade-out');
        
        // Hapus element setelah animation selesai
        setTimeout(() => {
          notifEl.remove();
          console.log('Custom notification removed');
        }, 500); // Durasi fade-out animation (0.5s)
      }, 5000); // Tampil selama 5 detik
    }



    function renderHistory() {
      const container = document.getElementById('historyContainer');
      if (doorLogs.length === 0) {
        container.innerHTML = '<p class="text-purple-300 text-center py-12">Belum ada riwayat</p>';
        return;
      }

      const totalPages = Math.ceil(doorLogs.length / itemsPerPage);
      const start = (currentPage - 1) * itemsPerPage;
      const logs = doorLogs.slice(start, start + itemsPerPage);

      container.innerHTML = logs.map(log => `
        <div class="bg-white/5 rounded-xl p-4 border border-white/10">
          <div class="flex justify-between items-center">
            <div><p class="text-white font-semibold">${log.status}</p><p class="text-purple-300 text-xs">Jarak: ${log.distance} cm</p></div>
            <p class="text-purple-200 text-sm">${formatDate(log.timestamp)}</p>
          </div>
        </div>
      `).join('');

      if (totalPages > 1) {
        const pagination = document.getElementById('pagination');
        pagination.classList.remove('hidden');
        pagination.innerHTML = `
          <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-3 py-2 rounded bg-white/5 text-white disabled:opacity-30">Prev</button>
          <span class="text-white">${currentPage} / ${totalPages}</span>
          <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="px-3 py-2 rounded bg-white/5 text-white disabled:opacity-30">Next</button>
        `;
      }
    }

    function sendActivityNotification(status, distance) {
      if (notificationEnabled) {
        const icon = status === 'OPEN' ? '🚨' : '✅';
        const title = icon + ' ' + (status === 'OPEN' ? 'PINTU TERBUKA' : 'PINTU TERTUTUP');
        const body = `Status: ${status} | Jarak: ${distance} cm`;
        
        // Tampilkan custom notification di website
        showCustomNotification(title, body);
        
        // Play bell sound HANYA jika OPEN
        if (status === 'OPEN') {
          console.log('🔔 Door OPEN - Playing ring bell sound NOW');
          playRingBellSound();
        }
        
        // Kirim notifikasi browser/desktop/Android
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            const notificationOptions = {
              body: body,
              tag: 'door-notification',
              requireInteraction: status === 'OPEN',
              vibrate: status === 'OPEN' ? [200, 100, 200, 100, 200] : [100, 50, 100],
              silent: false,
              // Action buttons untuk OPEN status (desktop + Android)
              actions: status === 'OPEN' ? [
                { action: 'open_door', title: 'Buka 🔓' },
                { action: 'close_door', title: 'Tutup 🔒' }
              ] : []
            };
            
            const notification = new Notification(title, notificationOptions);
            
            // Handle notification click
            notification.onclick = function() {
              console.log('Notification clicked');
              window.focus();
              notification.close();
            };
            
            // Handle action button clicks
            notification.onaction = function(event) {
              console.log('Notification action:', event.action);
              if (event.action === 'open_door') {
                console.log('User clicked BUKA');
              } else if (event.action === 'close_door') {
                console.log('User clicked TUTUP');
              }
              window.focus();
              notification.close();
            };
            
            const isAndroid = /Android|webOS/i.test(navigator.userAgent);
            console.log(`✅ Notification sent to ${isAndroid ? 'Android' : 'Desktop'}`);
            
            // Auto close setelah 5 detik jika bukan OPEN (hanya desktop)
            if (status !== 'OPEN' && !isAndroid) {
              setTimeout(() => {
                try {
                  notification.close();
                } catch (e) {}
              }, 5000);
            }
            
          } catch (error) {
            console.error('Notification error:', error);
          }
        }
        
        console.log('Activity notification sent:', title, body);
      }
    }

    function changePage(page) {
      const totalPages = Math.ceil(doorLogs.length / itemsPerPage);
      if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderHistory();
      }
    }

    function loadDashboard() {
      let previousLogsCount = 0;

      db.ref('doorLogs').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          doorLogs = Object.entries(data).map(([key, value]) => ({
            timestamp: value.timestamp,
            ...value
          })).sort((a, b) => b.timestamp - a.timestamp);
          document.getElementById('totalLogs').textContent = doorLogs.length;
          
          // Kirim notifikasi jika ada aktivitas baru
          if (doorLogs.length > previousLogsCount && doorLogs.length > 0) {
            const newLog = doorLogs[0];
            sendActivityNotification(newLog.status, newLog.distance);
          }
          previousLogsCount = doorLogs.length;
          
          // Ambil status dari riwayat terbaru
          if (doorLogs.length > 0) {
            const latestLog = doorLogs[0];
            updateStatusUI(latestLog.status, latestLog.timestamp);
          }
          
          renderHistory();
        }
      });
    }
  </script>
</body>
</html>
