<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Door Monitoring Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  
  <div id="loadingScreen" class="min-h-screen flex items-center justify-center">
    <p class="text-white text-lg">Loading...</p>
  </div>

  <div id="loginPage" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">IoT Door Monitor</h1>
        <p class="text-purple-200">Login dengan Firebase</p>
      </div>

      <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-8 border border-white/20">
        <form id="loginForm" class="space-y-6">
          <input type="email" id="email" placeholder="Email" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white" required>
          <input type="password" id="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white" required>
          <div id="loginError" class="hidden text-red-400 text-sm"><span id="loginErrorText"></span></div>
          <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-xl hover:bg-purple-700">Login</button>
        </form>
        <button onclick="togglePage()" class="w-full mt-4 text-purple-400 text-sm hover:text-purple-300">Belum punya akun? Daftar</button>
      </div>
    </div>
  </div>

  <div id="registerPage" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-white mb-2">Daftar Akun</h1>
      </div>

      <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-8 border border-white/20">
        <form id="registerForm" class="space-y-6">
          <input type="email" id="registerEmail" placeholder="Email" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white" required>
          <input type="password" id="registerPassword" placeholder="Password (min 6 char)" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white" required minlength="6">
          <div id="registerError" class="hidden text-red-400 text-sm"><span id="registerErrorText"></span></div>
          <div id="registerSuccess" class="hidden text-green-400 text-sm">Akun berhasil dibuat!</div>
          <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-xl hover:bg-purple-700">Daftar</button>
        </form>
        <button onclick="togglePage()" class="w-full mt-4 text-purple-400 text-sm hover:text-purple-300">Sudah punya akun? Login</button>
      </div>
    </div>
  </div>

  <div id="dashboardPage" class="hidden">
    <!-- Notifikasi Audio -->
    <audio id="notificationSound" preload="auto">
      <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj==" type="audio/wav">
    </audio>

    <div class="p-8">
      <div class="max-w-7xl mx-auto mb-8 flex justify-between items-center">
        <div>
          <h1 class="text-5xl font-bold text-white">IoT Door Monitor</h1>
          <p class="text-purple-200">User: <span id="userEmail"></span></p>
        </div>
        <button onclick="logout()" class="bg-red-600 text-white px-6 py-3 rounded-xl">Logout</button>
      </div>

      <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-6">
        <div class="bg-white/10 rounded-3xl p-8 border border-white/20">
          <h2 class="text-2xl font-bold text-white mb-6">Status Pintu</h2>
          <div class="text-center py-8">
            <p id="statusText" class="text-5xl font-bold text-green-400 mb-2">CLOSED</p>
            <p id="lastUpdate" class="text-purple-200">Terakhir update: -</p>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-white/5 rounded-xl p-4"><p class="text-purple-300 text-sm">Total Logs</p><p id="totalLogs" class="text-white text-2xl">0</p></div>
            <div class="bg-white/5 rounded-xl p-4"><p class="text-purple-300 text-sm">Notifikasi</p><p id="notifStatus" class="text-white text-2xl">OFF</p></div>
          </div>
        </div>

        <div class="bg-white/10 rounded-3xl p-8 border border-white/20">
          <h2 class="text-2xl font-bold text-white mb-6">Riwayat Aktivitas</h2>
          <div id="historyContainer" class="space-y-3 min-h-[400px]">
            <p class="text-purple-300 text-center py-12">Belum ada riwayat</p>
          </div>
          <div id="pagination" class="hidden mt-6 flex justify-center gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA1kCaXAKhzdv28TwxCyi_Sre5SzQmYyKQ",
      authDomain: "sbdp10-6b194.firebaseapp.com",
      databaseURL: "https://sbdp10-6b194-default-rtdb.firebaseio.com",
      projectId: "sbdp10-6b194",
      storageBucket: "sbdp10-6b194.firebasestorage.app",
      messagingSenderId: "855068226828",
      appId: "1:855068226828:web:072650849ed568ea144529"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let doorLogs = [];
    let currentPage = 1;
    const itemsPerPage = 5;

    auth.onAuthStateChanged((user) => {
      document.getElementById('loadingScreen').classList.add('hidden');
      if (user) {
        document.getElementById('userEmail').textContent = user.email;
        showDashboard();
      } else {
        document.getElementById('loginPage').classList.remove('hidden');
      }
    });

    function togglePage() {
      document.getElementById('loginPage').classList.toggle('hidden');
      document.getElementById('registerPage').classList.toggle('hidden');
    }

    function showDashboard() {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('registerPage').classList.add('hidden');
      document.getElementById('dashboardPage').classList.remove('hidden');
      loadDashboard();
    }

    async function logout() {
      await auth.signOut();
      document.getElementById('dashboardPage').classList.add('hidden');
      document.getElementById('loginPage').classList.remove('hidden');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      const errorText = document.getElementById('loginErrorText');

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        errorText.textContent = error.message;
        errorDiv.classList.remove('hidden');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const errorDiv = document.getElementById('registerError');
      const errorText = document.getElementById('registerErrorText');
      const successDiv = document.getElementById('registerSuccess');

      try {
        await auth.createUserWithEmailAndPassword(email, password);
        successDiv.classList.remove('hidden');
        document.getElementById('registerForm').reset();
        setTimeout(() => {
          togglePage();
          successDiv.classList.add('hidden');
        }, 2000);
      } catch (error) {
        errorText.textContent = error.message;
        errorDiv.classList.remove('hidden');
      }
    });

    function formatDate(timestamp) {
    return new Date(timestamp).toLocaleString('id-ID', {
        timeZone: 'Asia/Jakarta',
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
    }

    function updateStatusUI(state, updatedAt) {
      const statusText = document.getElementById('statusText');
      statusText.textContent = state;
      document.getElementById('lastUpdate').textContent = 'Terakhir update: ' + formatDate(updatedAt);

      if (state === 'OPEN') {
        statusText.className = 'text-5xl font-bold text-red-400 mb-2';
        playNotification();
      } else {
        statusText.className = 'text-5xl font-bold text-green-400 mb-2';
      }
    }

    function playNotification() {
      const audio = document.getElementById('notificationSound');
      if (audio) {
        audio.play().catch(e => console.log('Audio play error:', e));
      }
    }

    function renderHistory() {
      const container = document.getElementById('historyContainer');
      if (doorLogs.length === 0) {
        container.innerHTML = '<p class="text-purple-300 text-center py-12">Belum ada riwayat</p>';
        return;
      }

      const totalPages = Math.ceil(doorLogs.length / itemsPerPage);
      const start = (currentPage - 1) * itemsPerPage;
      const logs = doorLogs.slice(start, start + itemsPerPage);

      container.innerHTML = logs.map(log => `
        <div class="bg-white/5 rounded-xl p-4 border border-white/10">
          <div class="flex justify-between items-center">
            <div><p class="text-white font-semibold">${log.status}</p><p class="text-purple-300 text-xs">Jarak: ${log.distance} cm</p></div>
            <p class="text-purple-200 text-sm">${formatDate(log.timestamp)}</p>
          </div>
        </div>
      `).join('');

      if (totalPages > 1) {
        const pagination = document.getElementById('pagination');
        pagination.classList.remove('hidden');
        pagination.innerHTML = `
          <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-3 py-2 rounded bg-white/5 text-white disabled:opacity-30">Prev</button>
          <span class="text-white">${currentPage} / ${totalPages}</span>
          <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="px-3 py-2 rounded bg-white/5 text-white disabled:opacity-30">Next</button>
        `;
      }
    }

    function changePage(page) {
      const totalPages = Math.ceil(doorLogs.length / itemsPerPage);
      if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderHistory();
      }
    }

    function loadDashboard() {
      db.ref('doorLogs').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          doorLogs = Object.entries(data).map(([key, value]) => ({
            timestamp: value.timestamp,
            ...value
          })).sort((a, b) => b.timestamp - a.timestamp);
          document.getElementById('totalLogs').textContent = doorLogs.length;
          
          // Ambil status dari riwayat terbaru
          if (doorLogs.length > 0) {
            const latestLog = doorLogs[0];
            updateStatusUI(latestLog.status, latestLog.timestamp);
          }
          
          renderHistory();
        }
      });
    }
  </script>
</body>
</html>
